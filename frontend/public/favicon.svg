<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" fill="none">
  <!-- Right side filled block -->
  <path d="M52,18 L90,18 C90,18 90,65 90,85 C90,105 52,120 52,120 Z" fill="#0B4EA2" stroke="#0B4EA2" stroke-width="2" />
  
  <!-- Left side outline lines -->
  <path d="M10,18 L48,18 C48,18 48,65 48,85 C48,105 10,120 10,120 Z" fill="#FFFFFF" stroke="#0B4EA2" stroke-width="4" />
  
  <!-- Dividing line between left and right halves -->
  <line x1="50" y1="18" x2="50" y2="120" stroke="#FFFFFF" stroke-width="4" />

  <!-- Left side divisions -->
  <line x1="10" y1="52" x2="48" y2="52" stroke="#0B4EA2" stroke-width="3" />
  <line x1="10" y1="84" x2="48" y2="84" stroke="#0B4EA2" stroke-width="3" />

  <!-- Top text above left half -->
  <text x="10" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#0B4EA2" letter-spacing="-0.1">Leadership &amp; Excellence</text>

  <!-- 1st box: Open Book -->
  <g transform="translate(18, 24)">
    <path d="M4,11 C8,9 14,10 14,10 C14,10 20,9 24,11 L24,4 C20,2 14,3 14,3 C14,3 8,2 4,4 Z" fill="none" stroke="#0B4EA2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="14" y1="3" x2="14" y2="10" stroke="#0B4EA2" stroke-width="1.5" />
  </g>

  <!-- 2nd box: Five-pointed Star -->
  <polygon points="29,58 32,64 39,65 34,70 35,77 29,73 23,77 24,70 19,65 26,64" fill="none" stroke="#0B4EA2" stroke-width="2" stroke-linejoin="round" />

  <!-- 3rd box: Rising columns -->
  <g transform="translate(16, 90)">
    <path d="M2,24 L2,16 L10,10 L18,16 L18,24" fill="none" stroke="#0B4EA2" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="24" x2="6" y2="13" stroke="#0B4EA2" stroke-width="2" />
    <line x1="10" y1="24" x2="10" y2="10" stroke="#0B4EA2" stroke-width="2" />
    <line x1="14" y1="24" x2="14" y2="13" stroke="#0B4EA2" stroke-width="2" />
  </g>

  <!-- Right side: Torch and Flame -->
  <path d="M66,54 L74,54 L72,94 L68,94 Z" fill="#FFFFFF" />
  <path d="M70,22 C73,30 79,35 77,46 C75,50 70,52 68,52 C64,52 62,48 64,42 C64,36 68,34 68,30 C68,26 65,26 65,22 C67,26 71,28 71,32 C71,36 67,38 67,42 C67,46 72,48 73,44 C74,40 70,36 70,22 Z" fill="#FFC107" />
