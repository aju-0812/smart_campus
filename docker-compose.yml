version: '3.8'

services:
  backend:
    build: ./backend
    container_name: smart-campus-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./smart_campus.db
    volumes:
      - ./backend:/app
    restart: always

  frontend:
    build: ./frontend
    container_name: smart-campus-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKID_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always
